name: Weekly Boeing Manuals Download

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Boeing Downloader
      run: python download_boeing.py

    - name: Update Manuals JSON
      run: python generate_manuals.py

    - name: Commit and Push downloaded PDFs
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add AC/Boeing/ manuals.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Weekly Boeing Manuals Auto-Update" && git push)
