name: Weekly Boeing Manuals Download

on:
  schedule:
    # 한국 시간(KST) 매주 월요일 오전 10시 = UTC 월요일 01:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소 코드 불러오기
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. 파이썬 환경 세팅
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 크롤링 및 다운로드에 필요한 라이브러리 설치
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. 보잉 매뉴얼 다운로드 스크립트 실행
    - name: Run Boeing Downloader
      run: python download_boeing.py

    # 5. 매뉴얼 목록 JSON 파일 자동 갱신 (선택 사항)
    - name: Update Manuals JSON
      run: python generate_manuals.py

    # 6. 새로 받거나 변경된 PDF 파일 Git 커밋 & 푸시
    - name: Commit and Push downloaded PDFs
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add AC/Boeing/ manuals.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Weekly Boeing Manuals Auto-Update" && git push)
