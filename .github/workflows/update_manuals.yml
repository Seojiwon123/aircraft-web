name: Auto Generate Aircraft Manuals JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run generate_manuals.py
      run: python generate_manuals.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add manuals.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Auto-generated manuals.json" && git push)
