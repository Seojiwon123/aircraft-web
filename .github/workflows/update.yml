name: Daily ATIS Data Update

on:
  schedule:
    # 매일 한국 시간 새벽 3시 (UTC 기준 18:00) 자동 실행
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHub 웹에서 [수동 실행] 버튼 제공

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 및 브라우저 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: ATIS 엑셀 다운로드 및 데이터 변환 실행
      run: |
        python test_atis_download.py
        python process_data.py

    - name: 변경된 data.json 자동 저장 및 커밋
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json downloads/
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [자동] ATIS 최신 데이터 업데이트" && git push)
