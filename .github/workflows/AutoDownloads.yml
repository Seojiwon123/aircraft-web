name: Weekly Aircraft Data & Manuals Auto Update

on:
  schedule:
    # 한국 시간(KST) 매주 월요일 오전 7시 = UTC 일요일 22:00
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  update-aircraft-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas openpyxl playwright

    - name: Install Playwright Browsers
      run: |
        playwright install chromium --with-deps

    # 1. ATIS 엑셀 다운로드 및 data.json 변환
    - name: Run ATIS Downloader & JSON Converter
      run: |
        python "ATIS download.py"

    # 2. 보잉 매뉴얼 자동 다운로드
    - name: Run Boeing Downloader
      run: |
        python download_boeing.py

    # 3. 에어버스 매뉴얼 자동 다운로드 (신규 추가!)
    - name: Run Airbus Downloader
      run: |
        python download_airbus.py

    # 4. 전체 manuals.json 매뉴얼 목록 갱신 (AC/Boeing 및 AC/Airbus 포함)
    - name: Update Manuals JSON
      run: |
        python generate_manuals.py

    # 5. 변경된 파일 전체(data.json, AC/ 폴더 하위 파일들, manuals.json) Commit & Push
    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json AC/ manuals.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] Auto-update ATIS data, Boeing & Airbus manuals" && git push)
