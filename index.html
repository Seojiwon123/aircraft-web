<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 항공기 등록 현황 및 기술 제원</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 2.5rem 0; margin-bottom: 2rem; border-radius: 0 0 1rem 1rem; }
        .card { border: none; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-responsive { border-radius: 0.75rem; background: white; padding: 1rem; }
        .spec-badge { cursor: pointer; transition: all 0.2s; }
        .spec-badge:hover { transform: scale(1.05); }
        .modal-header { background-color: #1e3c72; color: white; }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <div class="hero-header text-center">
        <div class="container">
            <h1 class="fw-bold"><i class="fa-solid => fa-plane-departure me-2"></i>대한민국 항공기 등록 현황</h1>
            <p class="lead mb-0">ATIS 실시간 등록 데이터 및 기종별 상세 기술 제원 조회</p>
        </div>
    </div>

    <div class="container mb-5">
        <!-- 필터 및 검색 바 -->
        <div class="card p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <select id="airlineFilter" class="form-select">
                        <option value="">전체 항공사</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="등록기호, 기종명, 정치장 등으로 검색...">
                    </div>
                </div>
                <div class="col-md-3 text-end">
                    <button id="resetBtn" class="btn btn-outline-secondary w-100"><i class="fa-solid fa-rotate-left me-1"></i>필터 초기화</button>
                </div>
            </div>
        </div>

        <!-- 항공기 목록 테이블 -->
        <div class="table-responsive card">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>등록기호</th>
                        <th>항공사(소유자)</th>
                        <th>기종 (형식)</th>
                        <th>제작사</th>
                        <th>정치장</th>
                        <th class="text-center">상세 제원</th>
                    </tr>
                </thead>
                <tbody id="aircraftTableBody">
                    <!-- JavaScript로 데이터가 삽입됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 상세 제원 모달 (팝업창) -->
    <div class="modal fade" id="specModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="specModalTitle"><i class="fa-solid fa-circle-info me-2"></i>항공기 상세 제원</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="specModalBody">
                    <!-- 제원 세부 내용이 여기에 삽입됩니다 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 주요 항공기 상세 제원 데이터베이스 (공식 TCDS 및 Airport Planning Manual 기준)
        const aircraftSpecs = {
            "B737-800": { name: "Boeing 737-800", mfr: "Boeing", length: "39.5m", wingspan: "35.8m", height: "12.5m", mtow: "79,010 kg", engine: "CFM56-7B" },
            "B737-8": { name: "Boeing 737 MAX 8", mfr: "Boeing", length: "39.52m", wingspan: "35.9m", height: "12.3m", mtow: "82,190 kg", engine: "LEAP-1B" },
            "B777-300ER": { name: "Boeing 777-300ER", mfr: "Boeing", length: "73.9m", wingspan: "64.8m", height: "18.5m", mtow: "351,533 kg", engine: "GE90-115B" },
            "B787-9": { name: "Boeing 787-9 Dreamliner", mfr: "Boeing", length: "63.0m", wingspan: "60.1m", height: "17.0m", mtow: "254,000 kg", engine: "GEnx-1B / Trent 1000" },
            "A320-200": { name: "Airbus A320-200", mfr: "Airbus", length: "37.57m", wingspan: "35.8m", height: "11.76m", mtow: "78,000 kg", engine: "CFM56-5B / V2500" },
            "A321-200": { name: "Airbus A321-200", mfr: "Airbus", length: "44.51m", wingspan: "35.8m", height: "11.76m", mtow: "93,500 kg", engine: "CFM56-5B / V2500" },
            "A321-271NX": { name: "Airbus A321neo", mfr: "Airbus", length: "44.51m", wingspan: "35.8m", height: "11.76m", mtow: "97,000 kg", engine: "PW1100G-JM / LEAP-1A" },
            "A330-300": { name: "Airbus A330-300", mfr: "Airbus", length: "63.66m", wingspan: "60.3m", height: "16.79m", mtow: "242,000 kg", engine: "Trent 700 / CF6-80E1" },
            "A350-900": { name: "Airbus A350-900", mfr: "Airbus", length: "66.8m", wingspan: "64.75m", height: "17.05m", mtow: "280,000 kg", engine: "Trent XWB" },
            "A380-800": { name: "Airbus A380-800", mfr: "Airbus", length: "72.72m", wingspan: "79.75m", height: "24.09m", mtow: "575,000 kg", engine: "GP7200 / Trent 900" },
            "BELL206": { name: "Bell 206 JetRanger", mfr: "Bell Textron", length: "12.11m", wingspan: "10.16m (Main Rotor)", height: "2.83m", mtow: "1,451 kg", engine: "Allison 250-C20" }
        };

        let allAircraftData = [];

        // data.json 불러오기
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                allAircraftData = data;
                initAirlineFilter(data);
                renderTable(data);
            })
            .catch(err => {
                console.error("데이터 로드 오류:", err);
            });

        function initAirlineFilter(data) {
            const airlineSelect = document.getElementById('airlineFilter');
            const airlines = [...new Set(data.map(item => item['항공사'] || item['소유자']).filter(Boolean))];
            airlines.sort().forEach(airline => {
                const opt = document.createElement('option');
                opt.value = airline;
                opt.textContent = airline;
                airlineSelect.appendChild(opt);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('aircraftTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">검색 결과가 없습니다.</td></tr>';
                return;
            }

            data.forEach(item => {
                const regNo = item['등록기호'] || '-';
                const owner = item['항공사'] || item['소유자'] || '-';
                const type = item['기종'] || item['형식'] || '-';
                const mfr = item['제작사'] || '-';
                const base = item['정치장'] || '-';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-primary">${regNo}</td>
                    <td>${owner}</td>
                    <td>${type}</td>
                    <td>${mfr}</td>
                    <td>${base}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary spec-badge" onclick="showSpecModal('${type}')">
                            <i class="fa-solid fa-circle-info me-1"></i>제원 보기
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showSpecModal(typeKey) {
            const spec = aircraftSpecs[typeKey] || findMatchingSpec(typeKey);
            const modalTitle = document.getElementById('specModalTitle');
            const modalBody = document.getElementById('specModalBody');

            if (spec) {
                modalTitle.innerHTML = `<i class="fa-solid fa-plane me-2"></i>${spec.name}`;
                modalBody.innerHTML = `
                    <table class="table table-bordered mb-0">
                        <tbody>
                            <tr><th class="table-light" style="width: 35%;">제작사</th><td>${spec.mfr}</td></tr>
                            <tr><th class="table-light">전장 (길이)</th><td>${spec.length}</td></tr>
                            <tr><th class="table-light">전폭 (날개폭)</th><td>${spec.wingspan}</td></tr>
                            <tr><th class="table-light">전고 (높이)</th><td>${spec.height}</td></tr>
                            <tr><th class="table-light">최대이륙중량</th><td>${spec.mtow}</td></tr>
                            <tr><th class="table-light">탑재 엔진</th><td>${spec.engine}</td></tr>
                        </tbody>
                    </table>
                `;
            } else {
                modalTitle.innerHTML = `<i class="fa-solid fa-circle-question me-2"></i>${typeKey}`;
                modalBody.innerHTML = `<p class="text-muted text-center my-3">해당 기종(${typeKey})의 상세 기술 제원 정보가 등록되어 있지 않습니다.</p>`;
            }

            const modal = new bootstrap.Modal(document.getElementById('specModal'));
            modal.show();
        }

        function findMatchingSpec(typeKey) {
            for (const key in aircraftSpecs) {
                if (typeKey.includes(key) || key.includes(typeKey)) {
                    return aircraftSpecs[key];
                }
            }
            return null;
        }

        // 검색 및 필터 이벤트
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('airlineFilter').addEventListener('change', filterData);
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('airlineFilter').value = '';
            renderTable(allAircraftData);
        });

        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const selectedAirline = document.getElementById('airlineFilter').value;

            const filtered = allAircraftData.filter(item => {
                const owner = item['항공사'] || item['소유자'] || '';
                const regNo = item['등록기호'] || '';
                const type = item['기종'] || item['형식'] || '';
                const base = item['정치장'] || '';

                const matchesSearch = regNo.toLowerCase().includes(searchText) ||
                                      owner.toLowerCase().includes(searchText) ||
                                      type.toLowerCase().includes(searchText) ||
                                      base.toLowerCase().includes(searchText);

                const matchesAirline = selectedAirline === '' || owner === selectedAirline;

                return matchesSearch && matchesAirline;
            });

            renderTable(filtered);
        }
    </script>
</body>
</html>
