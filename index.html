<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>항공기 등록 현황 및 제원</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        h1 {
            font-size: 1.5rem;
            color: #1e293b;
        }

        .btn-manual-modal {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-manual-modal:hover {
            background-color: #1d4ed8;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 2px solid #cbd5e1;
            white-space: nowrap;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
            color: #475569;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* 💡 정치장 컬럼 넓이 확대 및 글자 짤림 방지 */
        .col-location {
            min-width: 160px;
            white-space: nowrap;
        }

        /* 💡 상세 제원 버튼 컬럼 너비 최적화 */
        .col-spec-btn {
            width: 80px;
            text-align: center;
        }

        .btn-spec {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-spec:hover {
            background-color: #0f766e;
        }

        /* 모달 스타일 (제원 매뉴얼 & 상세제원) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 650px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0f172a;
        }

        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .tab-btn {
            padding: 6px 16px;
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tab-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .manual-list {
            overflow-y: auto;
            flex: 1;
            max-height: 400px;
            padding-right: 5px;
        }

        .manual-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #f1f5f9;
            border-radius: 6px;
            margin-bottom: 8px;
            background-color: #fafafa;
        }

        .manual-item-title {
            font-size: 0.9rem;
            color: #334155;
            word-break: break-all;
        }

        .btn-download {
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .btn-close {
            margin-top: 16px;
            width: 100%;
            padding: 10px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>✈️ 대한민국 항공기 등록 현황</h1>
        <button class="btn-manual-modal" onclick="openManualModal()">📑 제조사별 제원 매뉴얼 (PDF)</button>
    </div>

    <div class="table-wrapper">
        <table id="aircraft-table">
            <thead>
                <tr id="table-header">
                    <!-- JavaScript에서 자동 생성 -->
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- JavaScript에서 자동 생성 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 1. 제조사별 공식 제원 매뉴얼 모달 -->
<div class="modal-overlay" id="manual-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">📑 제조사별 공식 제원 매뉴얼</div>
        </div>
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('Boeing')">Boeing</button>
            <button class="tab-btn" onclick="switchTab('Airbus')">Airbus</button>
            <button class="tab-btn" onclick="switchTab('Others')">기타</button>
        </div>
        <div class="manual-list" id="manual-list-container">
            <!-- manuals.json 연동 목록 생성 -->
        </div>
        <button class="btn-close" onclick="closeManualModal()">닫기</button>
    </div>
</div>

<!-- 2. 개별 항공기 상세 제원 모달 -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="detail-title">🔍 상세 제원 정보</div>
        </div>
        <div class="manual-list" id="detail-content" style="font-size:0.9rem;">
            <!-- 개별 데이터 표시 -->
        </div>
        <button class="btn-close" onclick="closeDetailModal()">닫기</button>
    </div>
</div>

<script>
    let manualsData = { Boeing: [], Airbus: [], Others: [] };
    let currentTab = 'Boeing';

    // 1. data.json 로드하여 테이블 생성
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            renderTable(data);
        })
        .catch(err => console.error("data.json 로드 실패:", err));

    // 2. manuals.json 로드
    fetch('manuals.json')
        .then(response => response.json())
        .then(data => {
            manualsData = data;
        })
        .catch(err => console.error("manuals.json 로드 실패:", err));

    function renderTable(data) {
        const headerTr = document.getElementById('table-header');
        const bodyTbody = document.getElementById('table-body');

        headerTr.innerHTML = '';
        bodyTbody.innerHTML = '';

        // 헤더 생성
        data.headers.forEach(headerText => {
            const th = document.createElement('th');
            th.textContent = headerText;
            
            // 정치장 헤더 클래스 추가
            if (headerText.includes('정치장')) {
                th.classList.add('col-location');
            } else if (headerText.includes('상세')) {
                th.classList.add('col-spec-btn');
            }
            headerTr.appendChild(th);
        });

        // 행 데이터 생성
        data.rows.forEach(row => {
            const tr = document.createElement('tr');
            
            data.raw_headers.forEach(header => {
                const td = document.createElement('td');
                td.textContent = row[header] || '-';
                
                // 정치장 셀 짤림 방지 클래스 적용
                if (header.includes('정치장')) {
                    td.classList.add('col-location');
                }
                tr.appendChild(td);
            });

            // 💡 상세 제원 버튼 셀 ('제원 보기' -> '제원'으로 짧게 변경)
            const tdSpec = document.createElement('td');
            tdSpec.classList.add('col-spec-btn');
            
            const btnSpec = document.createElement('button');
            btnSpec.className = 'btn-spec';
            btnSpec.textContent = '제원'; // 문구 수정!
            btnSpec.onclick = () => openDetailModal(row);
            
            tdSpec.appendChild(btnSpec);
            tr.appendChild(tdSpec);

            bodyTbody.appendChild(tr);
        });
    }

    // 제원 매뉴얼 모달 제어
    function openManualModal() {
        document.getElementById('manual-modal').classList.add('active');
        renderManualList();
    }

    function closeManualModal() {
        document.getElementById('manual-modal').classList.remove('active');
    }

    function switchTab(category) {
        currentTab = category;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.includes(category) || (category === 'Others' && btn.textContent.includes('기타')));
        });
        renderManualList();
    }

    function renderManualList() {
        const container = document.getElementById('manual-list-container');
        container.innerHTML = '';

        const list = manualsData[currentTab] || [];
        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">등록된 매뉴얼이 없습니다.</div>';
            return;
        }

        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'manual-item';
            div.innerHTML = `
                <span class="manual-item-title">📄 ${item.title}</span>
                <a href="${item.path}" class="btn-download" download>다운로드</a>
            `;
            container.appendChild(div);
        });
    }

    // 개별 상세 제원 모달
    function openDetailModal(row) {
        const container = document.getElementById('detail-content');
        const title = document.getElementById('detail-title');
        
        title.textContent = `🔍 ${row['등록번호'] || '항공기'} 상세 제원`;
        container.innerHTML = '';

        Object.keys(row).forEach(key => {
            const item = document.createElement('div');
            item.style.padding = '8px 0';
            item.style.borderBottom = '1px solid #f1f5f9';
            item.innerHTML = `<strong>${key}:</strong> ${row[key]}`;
            container.appendChild(item);
        });

        document.getElementById('detail-modal').classList.add('active');
    }

    function closeDetailModal() {
        document.getElementById('detail-modal').classList.remove('active');
    }
</script>

</body>
</html>
